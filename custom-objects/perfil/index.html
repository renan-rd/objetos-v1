  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {

    if (digits.length === 10) return '(' + digits.slice(0, 2) + ') ' + digits.slice(2, 6) + '-' + digits.slice(6);
    return String(raw);
  }

  async function associatedNames(api, link, ids) {
    const wanted = ids.map(String);
    const found = {};
    if (!wanted.length) return found;
    const key = fold(link.name);
    const db = window.__sbClient;
    try {
      if ((key === 'contato' || key === 'contatos') && db) {
        const { data } = await db.from('claude_contatos').select('id, nome, email, emails, telefone, telefones, foto_perfil').in('id', wanted);
        (data || []).forEach(row => {
          const email = primaryContactEmail(row);
          found[row.id] = { name: row.nome || 'Contato', meta: email, email, phone: primaryContactPhone(row), photo: row.foto_perfil || '' };
        });
      } else if ((key === 'empresa' || key === 'empresas') && db) {
        const { data } = await db.from('claude_empresas').select('id, nome, cnpj').in('id', wanted);
        (data || []).forEach(row => { found[row.id] = { name: row.nome || 'Empresa', meta: row.cnpj || '' }; });
      }
    } catch (error) {}
    const pending = wanted.filter(id => !found[id]);
    if (!pending.length || !link.objectId) return found;
    try {
      const fields = await api.listFields(link.objectId);
      const rows = await api.listRecords(link.objectId);
      const ordered = fields.slice().sort((a, b) => (a.position || 0) - (b.position || 0));
      const primary = ordered.find(field => field.is_primary) || ordered[0];
      const secondary = ordered.find(field => field !== primary);
      rows.forEach(row => {
        if (!pending.includes(String(row.id))) return;
        found[row.id] = {
          name: (primary && fieldValue(primary, row.data)) || link.name,
          meta: secondary ? fieldValue(secondary, row.data) : '',
          photo: row.data && (row.data.foto_perfil || row.data.foto) || ''
        };
      });
    } catch (error) {}
    return found;
  }

  function bindHistoryFilter() {
    const root = document.getElementById('history-filter');
    if (!root || root.dataset.bound === '1') return;
    root.dataset.bound = '1';
    const trigger = document.getElementById('history-filter-trigger');
    const list = document.getElementById('history-filter-list');
    trigger.addEventListener('click', () => setHistoryFilterOpen(list.hidden));
    list.addEventListener('mousedown', event => {
      if (event.target.closest('[data-history-type]')) event.preventDefault();
    });
    list.addEventListener('click', event => {
      const option = event.target.closest('[data-history-type]');
      if (!option) return;
      const key = option.dataset.historyType;
      if (historySelected.has(key)) historySelected.delete(key);
      else historySelected.add(key);
      renderHistoryFilterList();
      renderHistoryTags();
      paintHistory();
    });
    document.getElementById('history-filter-tags').addEventListener('click', event => {
      const remove = event.target.closest('[data-history-remove]');
      if (!remove) return;
      historySelected.delete(remove.dataset.historyRemove);
      renderHistoryTags();
      if (!list.hidden) renderHistoryFilterList();
      paintHistory();
    });
    document.addEventListener('mousedown', event => {
      if (!list.hidden && !root.contains(event.target)) setHistoryFilterOpen(false);
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !list.hidden) {
        setHistoryFilterOpen(false);
        trigger.focus();
      }
    });
    renderHistoryTags();
  }

  function describeRecord(fields, row) {
    const ordered = fields.slice().sort((a, b) => (a.position || 0) - (b.position || 0));
    const values = ordered.map(field => {
      const raw = row && row.data ? (row.data[field.id] ?? row.data[field.name]) : '';
      if (Array.isArray(raw)) return raw.filter(Boolean).join(', ');
      return raw ? String(raw) : '';
    }).filter(Boolean);
    return { id: String(row.id), name: values[0] || 'Registro', meta: values[1] || '', search: fold(values.join(' ')), linkKind: 'custom_record', photo: row.data && (row.data.foto_perfil || row.data.foto) || '', data: { ...(row.data || {}) } };
  }

  function createControl(field) {
    const id = 'link-field-' + field.id;
    if (field.field_type === 'date') {
      return '<input class="drawer-input" id="' + id + '" data-field-id="' + escapeHtml(field.id) + '" data-field-type="date" placeholder="DD/MM/AAAA" autocomplete="off">';
    }
    if (field.field_type === 'option') {
      const options = (Array.isArray(field.options) ? field.options : []).map(option => (
        '<option value="' + escapeHtml(option) + '">' + escapeHtml(option) + '</option>'
      )).join('');
      return '<select class="drawer-select" id="' + id + '" data-field-id="' + escapeHtml(field.id) + '" data-field-type="option"><option value="">Selecione</option>' + options + '</select>';
    }
    if (field.field_type === 'multiple_choice') {
      const options = (Array.isArray(field.options) ? field.options : []).map(option => (
        '<label class="link-check"><input type="checkbox" value="' + escapeHtml(option) + '" data-field-id="' + escapeHtml(field.id) + '"><span>' + escapeHtml(option) + '</span></label>'
      )).join('');
      return '<div class="link-checks">' + options + '</div>';
    }
    return '<input class="drawer-input" id="' + id + '" data-field-id="' + escapeHtml(field.id) + '" data-field-type="text" type="text" placeholder="Digite aqui" autocomplete="off">';
  }

  function readCreateData(fields) {
    const data = {};
    const missing = [];
    const ordered = fields.slice().sort((a, b) => (a.position || 0) - (b.position || 0));
    const nameField = ordered.find(field => field.is_primary) || ordered[0];
    fields.forEach(field => {
      let value = '';
      if (field.field_type === 'multiple_choice') {
        value = [...document.querySelectorAll('#link-create-fields input[data-field-id="' + field.id + '"]:checked')].map(input => input.value);
      } else {
        const input = document.querySelector('#link-create-fields [data-field-id="' + field.id + '"]');
        value = input ? String(input.value || '').trim() : '';
        if (field.field_type === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(value)) {
          const parts = value.split('-');
          value = parts[2] + '/' + parts[1] + '/' + parts[0];
        }
      }
      const empty = Array.isArray(value) ? !value.length : !value;
      if (empty && (field.is_required || (nameField && field.id === nameField.id))) missing.push(field.name);
      data[field.id] = value;
    });
    return { data, missing };
  }

  function updateLinkChrome() {
    if (!linkPanel || linkPanel.editingId) return;
    const hasItems = linkPanel.selected.size > 0;
    const title = (hasItems ? 'Editar ' : 'Adicionar ') + linkPanel.type.singular;
    document.getElementById('link-drawer-title').textContent = title;
    document.getElementById('drawer-edit-link').setAttribute('aria-label', title);
    document.getElementById('link-search-label').textContent = 'Buscar ' + linkPanel.type.singular;
    document.getElementById('link-selected-heading').textContent = linkPanel.type.selectedTitle;
    document.getElementById('link-drawer-save').textContent = linkPanel.tab === 'existing' ? 'Salvar' : 'Criar ' + linkPanel.type.singular;
  }

  function hideLinkPrincipalTip() {
    linkPrincipalTip.hidden = true;
  }

  function showLinkPrincipalTip(button) {
    linkPrincipalTip.hidden = false;
    const rect = button.getBoundingClientRect();
    const gap = 18;
    linkPrincipalTip.classList.remove('is-below');
    let top = rect.top - linkPrincipalTip.offsetHeight - gap;
    if (top < 8) {
      top = rect.bottom + gap;
      linkPrincipalTip.classList.add('is-below');
    }
    let left = rect.right - linkPrincipalTip.offsetWidth;
    const maxLeft = window.innerWidth - linkPrincipalTip.offsetWidth - 8;
    if (left < 8) left = 8;
    if (left > maxLeft) left = Math.max(8, maxLeft);
    linkPrincipalTip.style.top = top + 'px';
    linkPrincipalTip.style.left = left + 'px';
    const arrowHalf = 6;
    const buttonCenter = rect.left + rect.width / 2 - left;
    const minCenter = 8 + arrowHalf;
    const maxCenter = Math.max(minCenter, linkPrincipalTip.offsetWidth - 8 - arrowHalf);
    linkPrincipalTip.style.setProperty('--tip-arrow-left', Math.max(minCenter, Math.min(buttonCenter, maxCenter)) + 'px');
  }

  function closeLinkMenu() {
    cardMenuOpen = false;
    if (linkPanel) linkPanel.menuId = null;
    document.querySelectorAll('#link-selected-list .company-selected-menu-list, #assoc-cards .company-selected-menu-list').forEach(list => { list.hidden = true; });
    document.querySelectorAll('#link-selected-list .company-selected-menu-btn, #assoc-cards .company-selected-menu-btn').forEach(button => {
      button.setAttribute('aria-expanded', 'false');
    });
  }

  function positionLinkMenu(button, list) {
    const rect = button.getBoundingClientRect();
    list.style.top = '0px';
    list.style.left = '0px';
    const width = list.offsetWidth;
    const height = list.offsetHeight;
    const left = Math.max(8, rect.right - width);
    const below = rect.bottom + 4;
    const top = below + height + 8 > window.innerHeight ? Math.max(8, rect.top - 4 - height) : below;
    list.style.left = left + 'px';
    list.style.top = top + 'px';
  }

  function openLinkMenu(button) {
    closeLinkMenu();
    const list = button.parentElement && button.parentElement.querySelector('.company-selected-menu-list');
    if (!list) return;
    const searchList = document.getElementById('link-search-list');
    if (searchList) {
      searchList.hidden = true;
      const search = document.getElementById('link-search');
      if (search) search.setAttribute('aria-expanded', 'false');
    }
    if (button.closest('#link-selected-list') && linkPanel) linkPanel.menuId = button.dataset.id;
    else cardMenuOpen = true;
    list.hidden = false;
    button.setAttribute('aria-expanded', 'true');
    positionLinkMenu(button, list);
  }

  function showLinkSelectedSkeleton(type) {
    const list = document.getElementById('link-selected-list');
    const search = document.getElementById('link-search');
    list.classList.add('is-loading');
    list.dataset.kind = type && type.key === 'contato' ? 'contato' : 'record';
    list.setAttribute('aria-busy', 'true');
    const row = '<div class="company-selected-item" aria-hidden="true"><span class="skeleton link-skeleton-mark"></span><div class="company-selected-info"><span class="skeleton" style="width:168px"></span><span class="skeleton" style="width:112px;height:12px"></span></div></div>';
    list.innerHTML = row + row;
    if (search) search.disabled = true;
  }

  function clearLinkSelectedSkeleton() {
    const list = document.getElementById('link-selected-list');
    const search = document.getElementById('link-search');
    if (list) {
      list.classList.remove('is-loading');
      list.removeAttribute('aria-busy');
      delete list.dataset.kind;
    }
    if (search) search.disabled = false;
  }

  function renderLinkSelected() {
    if (!linkPanel) return;
    clearLinkSelectedSkeleton();
    closeLinkMenu();
    hideLinkPrincipalTip();
    const list = document.getElementById('link-selected-list');
    list.innerHTML = [...linkPanel.selected.values()].map(item => (
      '<div class="company-selected-item">'
      + recordMarkHtml(linkPanel.type, item)
      + '<div class="company-selected-info"><span class="company-selected-name">' + escapeHtml(item.name) + '</span>'
      + (item.meta ? '<span class="company-selected-meta">' + escapeHtml(item.meta) + '</span>' : '')
      + '</div>' + linkActionsHtml(item, item.id === linkPanel.principalId) + '</div>'
    )).join('');
    updateLinkChrome();
  }

  function renderLinkResults() {
    if (!linkPanel) return;
    const list = document.getElementById('link-search-list');
    const query = fold(document.getElementById('link-search').value.trim());
    const rows = linkPanel.records.filter(item => !query || item.search.includes(query)).slice(0, 30);
    if (!rows.length) {
      list.innerHTML = '<div class="company-autocomplete-empty">Nenhum registro encontrado</div>';
    } else {
      list.innerHTML = rows.map(item => (
        '<button type="button" class="company-autocomplete-option' + (linkPanel.selected.has(item.id) ? ' is-selected' : '') + '" role="option" data-id="' + escapeHtml(item.id) + '">'
        + '<span class="company-autocomplete-check">' + linkCheckSvg + '</span>'
        + (linkPanel.type.key === 'contato' ? contactAvatarHtml(item.name, item.photo) : '')
        + '<span class="company-autocomplete-option-text"><span class="company-autocomplete-option-name">' + escapeHtml(item.name) + '</span>'
        + (item.meta ? '<span class="company-autocomplete-option-meta">' + escapeHtml(item.meta) + '</span>' : '')
        + '</span></button>'
      )).join('');
    }
    list.hidden = false;
    document.getElementById('link-search').setAttribute('aria-expanded', 'true');
  }

  function showLinkTab(tab) {
    if (!linkPanel) return;
    linkPanel.tab = tab === 'create' ? 'create' : 'existing';
    document.getElementById('link-create-form').hidden = linkPanel.tab !== 'create';
    document.getElementById('link-existing-panel').hidden = linkPanel.tab !== 'existing';
    document.querySelectorAll('[data-link-tab]').forEach(button => {
      const active = button.dataset.linkTab === linkPanel.tab;
      button.classList.toggle('is-active', active);
      button.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    document.getElementById('link-drawer-tabs').hidden = false;
    showLinkError('');
    if (linkPanel.tab === 'existing') document.getElementById('link-search-list').hidden = true;
    updateLinkChrome();
  }

  function clearLinkDrawer() {
    const selected = document.getElementById('link-selected-list');
    const results = document.getElementById('link-search-list');
    const search = document.getElementById('link-search');
    clearLinkSelectedSkeleton();
    if (selected) selected.innerHTML = '';
    if (results) {
      results.innerHTML = '';
      results.hidden = true;
    }
    if (search) {
      search.value = '';
      search.setAttribute('aria-expanded', 'false');
    }
    const clear = document.getElementById('link-search-clear');
    if (clear) clear.hidden = true;
  }

  function closeLinkPanel() {
    linkPanelToken += 1;
    closeLinkMenu();
    hideLinkPrincipalTip();
    document.querySelector('main.content').classList.remove('detail-open', 'detail-edit');
    document.getElementById('detail-panel').setAttribute('aria-hidden', 'true');
    document.getElementById('drawer-edit-link').classList.remove('open');
    clearLinkDrawer();
    showLinkError('');
    linkPanel = null;
  }

  async function persistSelection() {
    const api = window.__customObjectsDb;
    const current = linkedRows.filter(row => String(row.object_link_id) === String(linkPanel.link.id));
    const byOther = new Map();
    current.forEach(row => {
      const other = String(row.left_id) === String(recordId) ? String(row.right_id) : String(row.left_id);
      byOther.set(other, row);
    });
    const wanted = new Set([...linkPanel.selected.keys()]);
    const remove = [...byOther.entries()].filter(([id]) => !wanted.has(id)).map(([, row]) => row.id);
    const add = [...wanted].filter(id => !byOther.has(id));
    await api.deleteRecordLinks(remove);
    const created = [];
    for (const id of add) {
      const item = linkPanel.selected.get(id);
      created.push(await api.createRecordLink({
        objectLinkId: linkPanel.link.id,
        leftKind: 'custom_record',
        leftId: recordId,
        rightKind: (item && item.linkKind) || 'custom_record',
        rightId: id
      }));
    }
    linkedRows = linkedRows.filter(row => !remove.includes(row.id)).concat(created);
    await persistPrincipal();
  }

  function linkOtherId(row) {
    return String(row.left_id) === String(recordId) ? String(row.right_id) : String(row.left_id);
  }

  function linkRowFor(id) {
    return linkedRows.find(row => String(row.object_link_id) === String(linkPanel.link.id) && linkOtherId(row) === String(id)) || null;
  }

  function applyPrincipalLocally(linkId, objectLinkId) {
    const scope = String(objectLinkId || (linkPanel && linkPanel.link && linkPanel.link.id) || '');
    linkedRows.forEach(row => {
      if (String(row.object_link_id) !== scope) return;
      if (String(row.left_id) !== String(recordId) && String(row.right_id) !== String(recordId)) return;
      row.principal = row.id === linkId;
    });
  }

  async function persistPrincipal() {
    if (!linkPanel) return;
    if (!linkPanel.principalId || !linkPanel.selected.has(linkPanel.principalId)) {
      linkPanel.principalId = linkPanel.selected.keys().next().value || null;
    }
    const row = linkPanel.principalId ? linkRowFor(linkPanel.principalId) : null;
    if (!row || typeof window.__customObjectsDb.setRecordLinkPrincipal !== 'function') return;
    await window.__customObjectsDb.setRecordLinkPrincipal(row.id, linkPanel.link.id, recordId);
    applyPrincipalLocally(row.id);
  }

  function refreshAssocCard() {
    const current = document.getElementById('assoc-' + linkPanel.type.key);
    const items = [...linkPanel.selected.values()].map(item => ({ ...item, principal: item.id === linkPanel.principalId }));
    const html = assocCard(linkPanel.type, linkPanel.link, items);
    if (current) current.outerHTML = html;
    window.__bindAssocLists?.();
  }

  async function loadLinkCatalog(type, objectId) {
    const api = window.__customObjectsDb;
    const native = NATIVE_OBJECTS[type.key];
    let fields = [];
    let records = [];
    try { fields = await api.listFields(objectId); } catch (error) { fields = []; }
    try {
      const rows = await api.listRecords(objectId);
      records = rows.map(row => describeRecord(fields, row));
    } catch (error) {
      records = [];
    }
    if (native && window.__sbClient) {
      const { data, error } = await window.__sbClient.from(native.table).select(native.columns).order('nome');
      if (!error && Array.isArray(data)) {
        const known = new Set(records.map(item => item.id));
        data.forEach(row => {
          const view = native.view(row);
          if (!known.has(view.id)) records.push(view);
        });
      }
      if (!fields.length) fields = native.fields.map((field, index) => ({ ...field, position: index }));
    }
    records.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
    return { fields, records };
  }

  async function openLinkPanel(section) {
    const type = ASSOC_TYPES.find(item => item.key === section.id.replace('assoc-', ''));
    const api = window.__customObjectsDb;
    if (!type || !section.dataset.objectId || !recordId || !api) return;
    const token = ++linkPanelToken;
    const link = { id: section.dataset.linkId, objectId: section.dataset.objectId, name: type.title };
    const content = document.querySelector('main.content');
    content.classList.add('detail-open', 'detail-edit');
    document.getElementById('detail-panel').setAttribute('aria-hidden', 'false');
    document.getElementById('drawer-edit-link').classList.add('open');
    clearLinkDrawer();
    document.getElementById('link-drawer-save').disabled = true;
    showLinkError('');
    linkPanel = { token, type, link, tab: 'existing', fields: [], records: [], selected: new Map() };
    showLinkTab('existing');
    showLinkSelectedSkeleton(type);
    try {
      const catalog = await loadLinkCatalog(type, link.objectId);
      if (!linkPanel || linkPanel.token !== token) return;
      linkPanel.fields = catalog.fields;
      linkPanel.records = catalog.records;
      const chosen = new Set(linkedRows.filter(row => String(row.object_link_id) === String(link.id)).map(row => (
        String(row.left_id) === String(recordId) ? String(row.right_id) : String(row.left_id)
      )));
      linkPanel.selected = new Map(catalog.records.filter(item => chosen.has(item.id)).map(item => [item.id, item]));
      const principalRow = linkedRows.find(row => String(row.object_link_id) === String(link.id) && row.principal && chosen.has(linkOtherId(row)));
      linkPanel.principalId = principalRow ? linkOtherId(principalRow) : (linkPanel.selected.keys().next().value || null);
      const ordered = catalog.fields.slice().sort((a, b) => (a.position || 0) - (b.position || 0));
      const nameField = ordered.find(field => field.is_primary) || ordered[0];
      document.getElementById('link-create-fields').innerHTML = ordered.length
        ? ordered.map(field => (
          '<div class="drawer-field"><label class="drawer-label" for="link-field-' + escapeHtml(field.id) + '">' + escapeHtml(field.name) + ((field.is_required || (nameField && field.id === nameField.id)) ? ' <span class="drawer-required">*</span>' : '') + '</label>' + createControl(field) + '</div>'
        )).join('')
        : '<p class="profile-empty">Este objeto não tem campos para cadastro.</p>';
      renderLinkSelected();
      document.getElementById('link-search-list').hidden = true;
      document.getElementById('link-search').setAttribute('aria-expanded', 'false');
      document.getElementById('link-drawer-save').disabled = false;
      const editId = pendingLinkEditId;
      pendingLinkEditId = null;
      if (editId && (linkPanel.selected.has(editId) || linkPanel.records.some(record => record.id === editId))) openLinkEditor(editId);
    } catch (error) {
      if (linkPanel && linkPanel.token === token) pendingLinkEditId = null;
      clearLinkSelectedSkeleton();
      document.getElementById('link-selected-list').innerHTML = '';
      showLinkError('Não foi possível carregar os registros.');
      document.getElementById('link-drawer-save').disabled = false;
    }
  }

  function clearCreateFields() {
    document.querySelectorAll('#link-create-fields input, #link-create-fields select').forEach(input => {
      if (input.type === 'checkbox') input.checked = false;
      else input.value = '';
    });
  }

  function fieldStoredValue(field, data) {
    const raw = data ? (data[field.id] ?? data[field.name]) : '';
    return raw == null ? '' : raw;
  }

  function fillCreateForm(item) {
    const data = item && item.data ? item.data : {};
    linkPanel.fields.forEach(field => {
      const stored = fieldStoredValue(field, data);
      if (field.field_type === 'multiple_choice') {
        const values = Array.isArray(stored) ? stored.map(String) : String(stored || '').split(',').map(part => part.trim()).filter(Boolean);
        document.querySelectorAll('#link-create-fields input[data-field-id="' + field.id + '"]').forEach(input => {
          input.checked = values.includes(input.value);
        });
        return;
      }
      const input = document.querySelector('#link-create-fields [data-field-id="' + field.id + '"]');
      if (!input) return;
      input.value = Array.isArray(stored) ? stored.join(', ') : String(stored || '');
    });
  }

  function openLinkEditor(id) {
    const item = linkPanel.selected.get(id) || linkPanel.records.find(record => record.id === id);
    if (!item) return;
    closeLinkMenu();
    hideLinkPrincipalTip();
    linkPanel.editingId = id;
    document.getElementById('link-drawer-tabs').hidden = true;
    document.getElementById('link-existing-panel').hidden = true;
    document.getElementById('link-create-form').hidden = false;
    document.getElementById('link-search-list').hidden = true;
    fillCreateForm(item);
    const title = 'Editar ' + linkPanel.type.singular;
    document.getElementById('link-drawer-title').textContent = title;
    document.getElementById('drawer-edit-link').setAttribute('aria-label', title);
    document.getElementById('link-drawer-save').textContent = 'Salvar ' + linkPanel.type.singular;
    linkPanel.editorSnapshot = JSON.stringify(readCreateData(linkPanel.fields).data);
    const first = document.querySelector('#link-create-fields input, #link-create-fields select');
    if (first) first.focus();
  }

  function leaveLinkEditor() {
    if (!linkPanel) return;
    linkPanel.editingId = null;
    linkPanel.editorSnapshot = null;
    clearCreateFields();
    document.getElementById('link-drawer-save').disabled = false;
    showLinkTab('existing');
    renderLinkSelected();
  }

  function paintAssocItem(item) {
    const card = document.getElementById('assoc-' + linkPanel.type.key);
    if (!card || !item) return;
    const row = card.querySelector('[data-record-id="' + CSS.escape(item.id) + '"]');
    if (!row) return;
    const mark = row.querySelector('.company-selected-logo, .avatar');
    const info = row.querySelector('.company-selected-info');
    if (mark) mark.outerHTML = recordMarkHtml(linkPanel.type, item);
    if (info) info.outerHTML = recordInfoHtml(linkPanel.type, item);
  }

  function replaceLinkRecord(view) {
    const index = linkPanel.records.findIndex(record => record.id === view.id);
    if (index >= 0) linkPanel.records[index] = view;
    else linkPanel.records.push(view);
    if (linkPanel.selected.has(view.id)) linkPanel.selected.set(view.id, view);
    paintAssocItem(view);
  }

  async function saveEditedLinkRecord() {
    const saveBtn = document.getElementById('link-drawer-save');
    const { data, missing } = readCreateData(linkPanel.fields);
    if (missing.length) {
      showLinkError('Preencha: ' + missing.join(', ') + '.');
      return;
    }
    if (linkPanel.editorSnapshot === JSON.stringify(data)) {
      leaveLinkEditor();
      return;
    }
    const id = linkPanel.editingId;
    const current = linkPanel.selected.get(id) || linkPanel.records.find(record => record.id === id) || { data: {} };
    saveBtn.disabled = true;
    showLinkError('');
    try {
      const native = linkPanel.fields.some(field => field.native) ? NATIVE_OBJECTS[linkPanel.type.key] : null;
      let view;
      if (native) {
        const payload = {};
        native.fields.forEach(field => { payload[field.id] = data[field.id] || null; });
        const { data: row, error } = await window.__sbClient.from(native.table).update(payload).eq('id', id).select(native.columns).single();
        if (error) throw error;
        view = native.view(row);
      } else {
        const next = { ...(current.data || {}), ...data };
        await window.__customObjectsDb.updateRecord(id, next);
        view = describeRecord(linkPanel.fields, { id, data: next });
      }
      replaceLinkRecord(view);
      leaveLinkEditor();
      const singular = linkPanel ? linkPanel.type.singular : '';
      const label = singular ? singular.charAt(0).toLocaleUpperCase('pt-BR') + singular.slice(1) : 'Registro';
      window.__showToast?.(label + ' atualizado com sucesso');
    } catch (error) {
      showLinkError('Não foi possível salvar o registro.');
      saveBtn.disabled = false;
    }
  }

  function removeSelectedRecord(id) {
    if (!linkPanel.selected.has(id)) return;
    linkPanel.selected.delete(id);
    if (linkPanel.principalId === id) linkPanel.principalId = linkPanel.selected.keys().next().value || null;
    renderLinkSelected();
    if (!document.getElementById('link-search-list').hidden) renderLinkResults();
  }

  async function markLinkPrincipal(id) {
    if (!linkPanel.selected.has(id) || linkPanel.principalId === id) return;
    const previous = linkPanel.principalId;
    linkPanel.principalId = id;
    renderLinkSelected();
    const row = linkRowFor(id);
    if (!row || typeof window.__customObjectsDb.setRecordLinkPrincipal !== 'function') return;
    try {
      await window.__customObjectsDb.setRecordLinkPrincipal(row.id, linkPanel.link.id, recordId);
      applyPrincipalLocally(row.id);
    } catch (error) {
      linkPanel.principalId = previous;
      renderLinkSelected();
      showLinkError('Não foi possível marcar como principal.');
    }
  }

  async function saveLinkPanel() {
    if (!linkPanel) return;
    if (linkPanel.editingId) {
      await saveEditedLinkRecord();
      return;
    }
    const saveBtn = document.getElementById('link-drawer-save');
    showLinkError('');
    if (linkPanel.tab === 'create') {
      const { data, missing } = readCreateData(linkPanel.fields);
      if (missing.length) {
        showLinkError('Preencha: ' + missing.join(', ') + '.');
        return;
      }
      saveBtn.disabled = true;
      try {
        const native = linkPanel.fields.some(field => field.native) ? NATIVE_OBJECTS[linkPanel.type.key] : null;
        let view;
        if (native) {
          const payload = {};
          native.fields.forEach(field => { payload[field.id] = data[field.id] || null; });
          const { data: row, error } = await window.__sbClient.from(native.table).insert(payload).select(native.columns).single();
          if (error) throw error;
          view = native.view(row);
        } else {
          const created = await window.__customObjectsDb.createRecord(linkPanel.link.objectId, data);
          view = describeRecord(linkPanel.fields, created);
        }
        linkPanel.records.push(view);
        linkPanel.selected.set(view.id, view);
        await persistSelection();
        refreshAssocCard();
        closeLinkPanel();
        window.__showToast?.('Registro criado com sucesso');
      } catch (error) {
        showLinkError('Não foi possível criar o registro.');
        saveBtn.disabled = false;
      }
      return;
    }
    saveBtn.disabled = true;
    try {
      await persistSelection();
      refreshAssocCard();
      closeLinkPanel();
      window.__showToast?.('Vínculo salvo com sucesso');
    } catch (error) {
      showLinkError('Não foi possível salvar o vínculo.');
      saveBtn.disabled = false;
    }
  }

  function sectionLink(section) {
    const type = ASSOC_TYPES.find(item => item.key === section.id.replace('assoc-', ''));
    if (!type) return null;
    return { type, link: { id: section.dataset.linkId, objectId: section.dataset.objectId, name: type.title } };
  }

  async function repaintAssocCard(section) {
    const context = sectionLink(section);
    if (!context) return;
    const rows = linkedRows.filter(row => String(row.object_link_id) === String(context.link.id));
    const ids = rows.map(linkOtherId).filter(Boolean);
    const names = await associatedNames(window.__customObjectsDb, context.link, ids);
    const items = ids.map(id => {
      const row = rows.find(item => linkOtherId(item) === String(id));
      return { id: String(id), principal: !!(row && row.principal), ...(names[id] || names[String(id)] || { name: context.type.title, meta: '' }) };
    });
    if (items.length && !items.some(item => item.principal)) items[0].principal = true;
    const current = document.getElementById(section.id);
    if (current) current.outerHTML = assocCard(context.type, context.link, items);
    window.__bindAssocLists?.();
  }

  async function markCardPrincipal(section, id) {
    const row = linkedRows.find(item => String(item.object_link_id) === String(section.dataset.linkId) && linkOtherId(item) === String(id));
    const button = section.querySelector('.company-selected-principal[data-id="' + CSS.escape(id) + '"]');
    if (!row || (button && button.getAttribute('aria-pressed') === 'true')) return;
    try {
      await window.__customObjectsDb.setRecordLinkPrincipal(row.id, section.dataset.linkId, recordId);
      applyPrincipalLocally(row.id, section.dataset.linkId);
      if (linkPanel && String(linkPanel.link.id) === String(section.dataset.linkId)) {
        linkPanel.principalId = String(id);
        renderLinkSelected();
      }
      await repaintAssocCard(section);
    } catch (error) {
      window.__showToast?.('Não foi possível marcar como principal');
    }
  }

  async function removeCardRecord(section, id) {
    const linkId = section.dataset.linkId;
    const row = linkedRows.find(item => String(item.object_link_id) === String(linkId) && linkOtherId(item) === String(id));
    if (!row) return;
    const remaining = linkedRows.filter(item => item.id !== row.id && String(item.object_link_id) === String(linkId));
    try {
      await window.__customObjectsDb.deleteRecordLinks([row.id]);
      linkedRows = linkedRows.filter(item => item.id !== row.id);
      if (row.principal && remaining[0]) {
        await window.__customObjectsDb.setRecordLinkPrincipal(remaining[0].id, linkId, recordId);
        applyPrincipalLocally(remaining[0].id, linkId);
      }
      if (linkPanel && String(linkPanel.link.id) === String(linkId)) {
        linkPanel.selected.delete(String(id));
        if (linkPanel.principalId === String(id)) linkPanel.principalId = linkPanel.selected.keys().next().value || null;
        renderLinkSelected();
        if (!document.getElementById('link-search-list').hidden) renderLinkResults();
      }
      await repaintAssocCard(section);
    } catch (error) {
      window.__showToast?.('Não foi possível remover a associação');
    }
  }

  document.getElementById('assoc-cards').addEventListener('click', event => {
    const section = event.target.closest('section[data-link-id]');
    const principalButton = event.target.closest('.company-selected-principal');
    if (principalButton && section) {
      markCardPrincipal(section, principalButton.dataset.id);
      return;
    }
    const item = event.target.closest('.company-selected-menu-item');
    if (item && section) {
      closeLinkMenu();
      if (item.dataset.action === 'edit') {
        pendingLinkEditId = String(item.dataset.id);
        openLinkPanel(section);
      }
      if (item.dataset.action === 'remove') removeCardRecord(section, item.dataset.id);
      return;
    }
    const menuButton = event.target.closest('.company-selected-menu-btn');
    if (menuButton) {
      if (menuButton.getAttribute('aria-expanded') === 'true') closeLinkMenu();
      else openLinkMenu(menuButton);
      return;
    }
    const button = event.target.closest('[data-assoc-edit]');
    if (!button || !section) return;
    openLinkPanel(section);
  });
  document.getElementById('assoc-cards').addEventListener('mouseover', event => {
    const button = event.target.closest('.company-selected-principal');
    if (button) showLinkPrincipalTip(button);
  });
  document.getElementById('assoc-cards').addEventListener('mouseout', event => {
    const button = event.target.closest('.company-selected-principal');
    if (!button || button.contains(event.relatedTarget)) return;
    hideLinkPrincipalTip();
  });
  document.getElementById('assoc-cards').addEventListener('focusin', event => {
    const button = event.target.closest('.company-selected-principal');
    if (button) showLinkPrincipalTip(button);
  });
  document.getElementById('assoc-cards').addEventListener('focusout', event => {
    const button = event.target.closest('.company-selected-principal');
    if (!button || button.contains(event.relatedTarget)) return;
    hideLinkPrincipalTip();
  });
  document.getElementById('link-drawer-tabs').addEventListener('click', event => {
    const tab = event.target.closest('[data-link-tab]');
    if (tab) showLinkTab(tab.dataset.linkTab);
  });
  document.getElementById('link-search').addEventListener('input', () => {
    document.getElementById('link-search-clear').hidden = document.getElementById('link-search').value === '';
    renderLinkResults();
  });
  document.getElementById('link-search').addEventListener('focus', renderLinkResults);
  document.getElementById('link-search-clear').addEventListener('click', () => {
    document.getElementById('link-search').value = '';
    document.getElementById('link-search-clear').hidden = true;
    renderLinkResults();
    document.getElementById('link-search').focus();
  });
  document.getElementById('link-search-list').addEventListener('mousedown', event => {
    if (event.target.closest('.company-autocomplete-option')) event.preventDefault();
  });
  document.getElementById('link-search-list').addEventListener('click', event => {
    const option = event.target.closest('.company-autocomplete-option');
    if (!option || !linkPanel) return;
    event.stopPropagation();
    const record = linkPanel.records.find(item => item.id === option.dataset.id);
    if (!record) return;
    if (linkPanel.selected.has(record.id)) {
      linkPanel.selected.delete(record.id);
      if (linkPanel.principalId === record.id) linkPanel.principalId = linkPanel.selected.keys().next().value || null;
    } else {
      linkPanel.selected.set(record.id, record);
      if (!linkPanel.principalId || !linkPanel.selected.has(linkPanel.principalId)) linkPanel.principalId = record.id;
    }
    renderLinkSelected();
    renderLinkResults();
  });
  document.getElementById('link-selected-list').addEventListener('click', event => {
    if (!linkPanel) return;
    const principalButton = event.target.closest('.company-selected-principal');
    if (principalButton) {
      markLinkPrincipal(principalButton.dataset.id);
      return;
    }
    const item = event.target.closest('.company-selected-menu-item');
    if (item) {
      const id = item.dataset.id;
      closeLinkMenu();
      if (item.dataset.action === 'edit') openLinkEditor(id);
      if (item.dataset.action === 'remove') removeSelectedRecord(id);
      return;
    }
    const button = event.target.closest('.company-selected-menu-btn');
    if (!button) return;
    if (button.getAttribute('aria-expanded') === 'true') closeLinkMenu();
    else openLinkMenu(button);
  });
  document.getElementById('link-selected-list').addEventListener('mouseover', event => {
    const button = event.target.closest('.company-selected-principal');
    if (button) showLinkPrincipalTip(button);
  });
  document.getElementById('link-selected-list').addEventListener('mouseout', event => {
    const button = event.target.closest('.company-selected-principal');
    if (!button || button.contains(event.relatedTarget)) return;
    hideLinkPrincipalTip();
  });
  document.getElementById('link-selected-list').addEventListener('focusin', event => {
    const button = event.target.closest('.company-selected-principal');
    if (button) showLinkPrincipalTip(button);
  });
  document.getElementById('link-selected-list').addEventListener('focusout', event => {
    const button = event.target.closest('.company-selected-principal');
    if (!button || button.contains(event.relatedTarget)) return;
    hideLinkPrincipalTip();
  });
  document.getElementById('link-create-form').addEventListener('submit', event => event.preventDefault());
  document.getElementById('link-drawer-save').addEventListener('click', saveLinkPanel);
  document.getElementById('link-drawer-cancel').addEventListener('click', () => {
    if (linkPanel && linkPanel.editingId) {
      leaveLinkEditor();
      return;
    }
    closeLinkPanel();
  });
  document.getElementById('link-drawer-close').addEventListener('click', closeLinkPanel);
  document.addEventListener('click', event => {
    if ((cardMenuOpen || (linkPanel && linkPanel.menuId)) && !event.target.closest('.company-selected-menu')) closeLinkMenu();
    if (!linkPanel) return;
    if (linkPanel.tab !== 'existing' || linkPanel.editingId) return;
    if (event.target.closest('#link-search-box')) return;
    document.getElementById('link-search-list').hidden = true;
    document.getElementById('link-search').setAttribute('aria-expanded', 'false');
  });
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    if (cardMenuOpen || (linkPanel && linkPanel.menuId)) {
      closeLinkMenu();
      return;
    }
    if (!linkPanel) return;
    const list = document.getElementById('link-search-list');
    if (list && !list.hidden) {
      list.hidden = true;
      document.getElementById('link-search').setAttribute('aria-expanded', 'false');
      return;
    }
    if (linkPanel.editingId) {
      leaveLinkEditor();
      return;
    }
    closeLinkPanel();
  });
  document.querySelector('#drawer-edit-link .drawer-body').addEventListener('scroll', () => {
    hideLinkPrincipalTip();
    if (linkPanel && linkPanel.menuId) closeLinkMenu();
  });
  document.addEventListener('scroll', () => {
    hideLinkPrincipalTip();
    if (cardMenuOpen || (linkPanel && linkPanel.menuId)) closeLinkMenu();
  }, true);
  document.addEventListener('error', event => {
    const image = event.target;
    if (!image || image.tagName !== 'IMG') return;
    const avatar = image.closest('.avatar');
    if (!avatar || !avatar.closest('#assoc-cards, #link-selected-list, #link-search-list')) return;
    avatar.innerHTML = contactAvatarSvg(image.alt || '');
  }, true);

  document.querySelector('.profile-col').addEventListener('click', event => {
    const button = event.target.closest('button.overview-accordion-head');
    if (!button) return;
    const card = button.closest('.overview-card');
    const collapsed = card.classList.toggle('is-collapsed');
    button.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    card.dataset.accordionUser = '1';
  });

  document.getElementById('profile-tabs').addEventListener('click', event => {
    const tab = event.target.closest('.profile-tab[data-tab]');
    if (!tab) return;
    document.querySelectorAll('.profile-tab').forEach(item => item.classList.toggle('active', item === tab));
    document.querySelectorAll('.profile-tab-panel').forEach(panel => {
      panel.classList.toggle('active', panel.dataset.tabPanel === tab.dataset.tab);
    });
  });

  async function loadProfile() {
    const api = window.__customObjectsDb;
    const failed = { failed: true };
    try {
      const session = await window.__auth?.getSession?.();
      if (!session || !api || !objectName) {
        render(failed);
        bindHistoryFilter();
        return;
      }
      const current = await api.getObjectByName(objectName);
      if (!current) {
        render(failed);
        bindHistoryFilter();
        return;
      }
      const fields = await api.listFields(current.id);
      let links = [];
      try { links = await api.listObjectLinks(current.id); } catch (error) { links = []; }
      const rows = await api.listRecords(current.id);
      const record = rows.find(row => String(row.id) === String(recordId)) || null;
      let recordLinks = [];
      if (record) {
        try { recordLinks = await api.listLinksForRecord(record.id); } catch (error) { recordLinks = []; }
      }
      linkedRows = recordLinks;
      const ordered = fields.slice().sort((a, b) => (a.position || 0) - (b.position || 0));
      const primary = ordered.filter(field => field.is_primary).slice(0, 3);
      const secondary = ordered.filter(field => !field.is_primary);
      const data = record ? (record.data || {}) : {};
      const raw = {};
      ordered.forEach(field => { raw[field.id] = fieldValue(field, data); });
      const first = primary[0] ? raw[primary[0].id] : '';
      window.__saveCustomRecordField = async (fieldId, value) => {
        if (!record) throw new Error('Não foi possível salvar. Tente novamente.');
        const field = ordered.find(item => item.id === fieldId);
        let stored = value || '';
        if (field && field.field_type === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(stored)) {
          const [year, month, day] = stored.split('-');
          stored = day + '/' + month + '/' + year;
        }
        if (field && field.field_type === 'multiple_choice') {
          stored = String(stored).split(',').map(item => item.trim()).filter(Boolean);
        }
        data[fieldId] = stored;
        const display = Array.isArray(stored) ? stored.join(', ') : stored;
        window.__profileFieldRaw[fieldId] = display;
        await api.updateRecord(record.id, data);
        historyEvents = await api.listRecordEvents(record.id);
        paintHistory();
        if (primary[0] && primary[0].id === fieldId) {
          document.getElementById('profile-title').textContent = display || cardLabel || objectName || 'Registro';
          document.title = document.getElementById('profile-title').textContent + ' — RD Station';
        }
      };
      const sidebarLinks = ASSOC_TYPES.map(type => links.find(link => assocType(link.name) === type)).filter(Boolean);
      const assocHtml = (await Promise.all(sidebarLinks.map(async link => {
        const type = assocType(link.name);
        const ids = recordLinks.map(row => {
          if (String(row.object_link_id) !== String(link.id)) return '';
          if (String(row.left_id) === String(record?.id)) return row.right_id;
          if (String(row.right_id) === String(record?.id)) return row.left_id;
          return '';
        }).filter(Boolean);
        const names = await associatedNames(api, link, ids);
        const linkRows = recordLinks.filter(row => String(row.object_link_id) === String(link.id));
        const items = ids.map(id => {
          const row = linkRows.find(item => {
            const other = String(item.left_id) === String(record.id) ? String(item.right_id) : String(item.left_id);
            return other === String(id);
          });
          return { id: String(id), principal: !!(row && row.principal), ...(names[id] || names[String(id)] || { name: type.title, meta: '' }) };
        });
        if (items.length && !items.some(item => item.principal)) items[0].principal = true;
        return assocCard(type, link, items);
      }))).join('');
      const singular = String(current.singular || '').trim();
      const cardLabel = singular
        ? singular.charAt(0).toLocaleUpperCase('pt-BR') + singular.slice(1)
        : 'Objeto';
      historyLabel = cardLabel;
      historyEvents = [];
      if (record) {
        try { historyEvents = await api.listRecordEvents(record.id); } catch (error) { historyEvents = []; }
      }
      render({
        objectLabel: current.name || objectName,
        cardLabel,
        recordLabel: first || current.name || objectName || 'Registro',
        primaryHtml: fieldRows(primary, data),
        secondaryHtml: fieldRows(secondary, data),
        raw,
        assocHtml
      });
      paintHistory();
      bindHistoryFilter();
    } catch (error) {
      historyEvents = [];
      render(failed);
      paintHistory();
      bindHistoryFilter();
    }
  }

  loadProfile();
})();
</script>
<script src="../../shared/products.js"></script>
<script src="../../shared/app-toast.js"></script>
</body>
