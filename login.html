<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — RD Station</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    window.__sbClient = supabase.createClient(
      'https://deeklhefjxldkweqjtsa.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRlZWtsaGVmanhsZGt3ZXFqdHNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE5Mzc5NjcsImV4cCI6MjA2NzUxMzk2N30.9oxYKZHfRNjbXJzQ17POORk_5Z12DDdkPUqAbeIdMcQ'
    );
  </script>
  <script src="shared/auth.js" data-login="./login.html"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #001927;
      --surface: #ffffff;
      --border: #b2bcc1;
      --text-high: #002233;
      --text-low: #405466;
      --danger: #e60f57;
      --btn-bg: #003d5c;
      --btn-text: #00dbff;
      --font: 'DM Sans', sans-serif;
    }

    html, body { height: 100%; }

    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--navy);
      font-family: var(--font);
      color: var(--text-high);
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px 32px 32px;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.28);
    }

    .logo {
      display: block;
      height: 32px;
      width: auto;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      line-height: 32px;
      letter-spacing: -0.24px;
      margin-bottom: 8px;
    }

    .lead {
      font-size: 16px;
      font-weight: 500;
      line-height: 24px;
      color: var(--text-low);
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      line-height: 20px;
      margin-bottom: 8px;
    }

    .field { margin-bottom: 16px; }

    input {
      width: 100%;
      height: 48px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text-high);
      font-family: var(--font);
      font-size: 16px;
      font-weight: 500;
      outline: none;
    }

    input[readonly] {
      background: #f5f7f8;
      color: var(--text-low);
      cursor: default;
    }

    input:not([readonly]):focus {
      border-color: #0077b2;
      box-shadow: 0 0 0 3px rgba(0, 219, 255, 0.35);
    }

    .error {
      display: none;
      margin: -4px 0 16px;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      color: var(--danger);
    }

    .error.visible { display: block; }

    button[type="submit"] {
      width: 100%;
      height: 48px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-family: var(--font);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button[type="submit"]:hover { filter: brightness(1.08); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: wait; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="contatos/logo-rd.svg" alt="RD Station" width="146" height="32">
    <h1>Entrar</h1>
    <p class="lead">Use a senha recebida ou solicite uma senha no Slack com o @brandao.</p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" value="design@rdstation.com" readonly tabindex="-1">
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      </div>
      <p class="error" id="login-error" role="alert"></p>
      <button type="submit" id="login-submit">Entrar</button>
    </form>
  </main>
  <script>
    (async function () {
      const FIXED_EMAIL = window.__auth?.FIXED_EMAIL || 'design@rdstation.com';
      const db = window.__sbClient;
      const form = document.getElementById('login-form');
      const password = document.getElementById('password');
      const submit = document.getElementById('login-submit');
      const errorEl = document.getElementById('login-error');

      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.toggle('visible', !!message);
      }

      function afterLoginUrl() {
        const next = window.__auth?.safeNextPath(new URLSearchParams(location.search).get('next'));
        return next || './contatos/index.html';
      }

      const session = await window.__auth.getSession();
      if (session) {
        location.replace(afterLoginUrl());
        return;
      }

      form.addEventListener('submit', async e => {
        e.preventDefault();
        showError('');
        const value = password.value;
        if (!value) {
          showError('Digite a senha.');
          password.focus();
          return;
        }

        submit.disabled = true;
        submit.textContent = 'Entrando...';
        const { error } = await db.auth.signInWithPassword({
          email: FIXED_EMAIL,
          password: value,
        });
        submit.disabled = false;
        submit.textContent = 'Entrar';

        if (error) {
          showError('Senha incorreta. Tente novamente.');
          password.select();
          return;
        }

        location.replace(afterLoginUrl());
      });
    })();
  </script>
</body>
</html>
